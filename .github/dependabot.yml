# Dependabot version updates: weekly PRs that keep dependencies current.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Only ecosystems that exist in the repo are listed; add `terraform` with the
# OpenTofu code (plan Phase 7). Vendored C++ headers can't be tracked here.
version: 2

updates:
  # Workflow actions are pinned to commit SHAs; Dependabot bumps the SHA and its
  # `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release before proposing it: most compromised or
    # broken releases are caught and pulled within days.
    cooldown:
      default-days: 7
    # One PR for all action bumps instead of one per action.
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Minor and patch updates together in one PR; major versions (which may
    # break the API) still arrive one per PR so each can be reviewed alone.
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
