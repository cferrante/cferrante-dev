name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

# A newer push to the same branch cancels the older, now-irrelevant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      # Retrieval latency gate (plan step 2.6): fails if hybrid p99 >= 1 ms.
      - run: make bench-engine
      # Retrieval quality gate (plan step 6.2): hit@5 over the public golden set,
      # from the committed Titan cache; fails below HITK_MIN in the Makefile.
      - run: make hitk-gate
      # Tests and builds must write only to build/ or temp folders (found in 6.2).
      - run: scripts/check-clean-tree.sh

  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check in-doc anchor links
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/check-doc-links.sh "$REF"
