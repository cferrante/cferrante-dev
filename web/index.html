<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cferrante.dev Context Concierge</title>
  <link rel="stylesheet" href="/dist/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="min-h-screen bg-term-bg font-mono text-sm text-term-fg">
  <main class="grid min-h-screen grid-cols-1 md:h-screen md:grid-cols-2">
    <section aria-label="Thought stream" class="flex min-h-0 flex-col border-term-line md:border-r">
      <header class="border-b border-term-line px-4 py-3">
        <h1 class="font-bold text-term-accent"><span id="site-name">cferrante.dev</span>
          <span id="assistant-name" class="text-term-dim">Context Concierge</span></h1>
      </header>

      <div id="thoughts" role="log" aria-label="Reasoning and agent steps"
           class="min-h-48 flex-1 space-y-2 overflow-y-auto px-4 py-3"></div>

      <div class="space-y-2 border-t border-term-line px-4 py-3">
        <p id="asked" class="text-term-dim"></p>
        <p id="answer" aria-live="polite" class="whitespace-pre-wrap leading-relaxed"></p>
        <div id="sources-block" hidden class="text-xs text-term-dim">
          <h2 class="mt-1">Sources</h2>
          <ol id="sources" class="space-y-0.5"></ol>
        </div>
        <div class="flex items-center gap-3">
          <p id="status" role="status" class="flex-1 text-term-dim data-[state=error]:text-term-error data-[state=streaming]:animate-pulse motion-reduce:animate-none"></p>
          <!-- Shaped like Ask and kept at the right edge, where Ask is. -->
          <div class="ml-auto flex shrink-0 gap-2">
            <button id="stop" type="button" hidden aria-keyshortcuts="Escape"
                    class="rounded border border-term-warn px-3 py-2 text-term-warn hover:bg-term-panel focus-visible:outline-2 focus-visible:outline-term-accent">
              Stop
            </button>
            <button id="retry" type="button" hidden
                    class="rounded border border-term-accent px-3 py-2 text-term-accent hover:bg-term-panel focus-visible:outline-2 focus-visible:outline-term-accent">
              Retry
            </button>
          </div>
        </div>
      </div>

      <!-- Confirm cards (design §6, §14): one per proposed action; nothing is
           sent until its Confirm. Rendered from #proposal-template. -->
      <ol id="proposals" aria-live="polite" class="mx-4 space-y-2 empty:hidden"></ol>

      <!-- Suggestion chips: stored, pre-checked answers that need no model call. -->
      <div id="chips" aria-label="Suggested questions" class="flex flex-wrap gap-2 px-4 pb-2 empty:hidden"></div>

      <form id="ask" class="flex gap-2 border-t border-term-line px-4 py-3">
        <label for="question" class="sr-only">Your question</label>
        <input id="question" name="question" autocomplete="off" maxlength="2000"
               placeholder="Ask about my work…"
               class="flex-1 rounded border border-term-line bg-term-panel px-3 py-2 text-term-fg placeholder:text-term-dim focus-visible:outline-2 focus-visible:outline-term-accent">
        <button id="send" type="submit"
                class="rounded border border-term-accent px-3 py-2 text-term-accent hover:bg-term-panel focus-visible:outline-2 focus-visible:outline-term-accent disabled:opacity-50">
          Ask
        </button>
      </form>
    </section>

    <section aria-label="Action cards" class="overflow-y-auto bg-term-panel p-4">
      <h2 class="mb-3 text-term-dim">Action cards <span class="text-xs">· measured by the server</span></h2>
      <ol id="cards" class="space-y-2"></ol>
      <p id="no-cards" class="text-term-dim">Each backend step appears here as it runs.</p>
    </section>
  </main>

  <!-- One template per Confirm card. data-status (pending | confirming | done
       | expired | failed) drives the styling. -->
  <template id="proposal-template">
    <li class="mb-1 rounded border border-term-warn bg-term-panel p-3 data-[status=done]:border-term-accent data-[status=expired]:border-term-line data-[status=failed]:border-term-error">
      <h2 data-role="title" class="font-bold text-term-warn"></h2>
      <p data-role="summary" class="mt-1 whitespace-pre-wrap"></p>
      <p data-role="outcome" class="mt-1 text-term-dim"></p>
      <div class="mt-2 flex items-center gap-2">
        <button data-role="confirm" type="button"
                class="rounded border border-term-accent px-3 py-1 text-term-accent hover:bg-term-bg focus-visible:outline-2 focus-visible:outline-term-accent disabled:opacity-50">
          Confirm
        </button>
        <button data-role="dismiss" type="button"
                class="rounded border border-term-line px-3 py-1 text-term-fg hover:bg-term-bg focus-visible:outline-2 focus-visible:outline-term-accent">
          Not now
        </button>
        <span data-role="time" class="ml-auto tabular-nums text-term-dim"></span>
      </div>
    </li>
  </template>

  <!-- One template for every action card (README conventions). data-state
       (active | ok | error | fallback | skipped) drives all the styling. -->
  <template id="card-template">
    <li class="group rounded border border-term-line bg-term-bg px-3 py-2 data-[state=active]:border-term-accent data-[state=error]:border-term-error data-[state=fallback]:border-term-warn">
      <div class="flex items-center gap-2">
        <span aria-hidden="true" class="size-2 shrink-0 rounded-full bg-term-dim group-data-[state=active]:animate-pulse group-data-[state=active]:bg-term-accent group-data-[state=ok]:bg-term-accent group-data-[state=error]:bg-term-error group-data-[state=fallback]:bg-term-warn motion-reduce:animate-none"></span>
        <span data-role="title" class="flex-1 truncate"></span>
        <span data-role="duration" class="tabular-nums text-term-dim"></span>
      </div>
      <ul data-role="details" class="mt-1 space-y-0.5 pl-4 text-xs text-term-dim"></ul>
    </li>
  </template>
</body>
</html>
