<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cferrante.dev receptionist</title>
  <link rel="stylesheet" href="/dist/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body class="min-h-screen bg-term-bg font-mono text-sm text-term-fg">
  <main class="grid min-h-screen grid-cols-1 md:h-screen md:grid-cols-2">
    <section aria-label="Thought stream" class="flex min-h-0 flex-col border-term-line md:border-r">
      <header class="border-b border-term-line px-4 py-3">
        <h1 class="font-bold text-term-accent">cferrante.dev <span class="text-term-dim">receptionist</span></h1>
      </header>

      <div id="thoughts" role="log" aria-label="Reasoning and agent steps"
           class="min-h-48 flex-1 space-y-2 overflow-y-auto px-4 py-3"></div>

      <div class="space-y-2 border-t border-term-line px-4 py-3">
        <p id="asked" class="text-term-dim"></p>
        <p id="answer" aria-live="polite" class="whitespace-pre-wrap leading-relaxed"></p>
        <div class="flex items-center gap-3">
          <p id="status" role="status" class="text-term-dim data-[state=error]:text-term-error"></p>
          <button id="retry" type="button" hidden
                  class="rounded border border-term-line px-2 py-1 text-term-fg hover:bg-term-panel focus-visible:outline-2 focus-visible:outline-term-accent">
            Retry
          </button>
        </div>
      </div>

      <form id="ask" class="flex gap-2 border-t border-term-line px-4 py-3">
        <label for="question" class="sr-only">Your question</label>
        <input id="question" name="question" autocomplete="off" maxlength="2000"
               placeholder="Ask about my work…"
               class="flex-1 rounded border border-term-line bg-term-panel px-3 py-2 text-term-fg placeholder:text-term-dim focus-visible:outline-2 focus-visible:outline-term-accent">
        <button id="send" type="submit"
                class="rounded border border-term-accent px-3 py-2 text-term-accent hover:bg-term-panel focus-visible:outline-2 focus-visible:outline-term-accent disabled:opacity-50">
          Ask
        </button>
      </form>
    </section>

    <section aria-label="Action cards" class="overflow-y-auto bg-term-panel p-4">
      <h2 class="mb-3 text-term-dim">Action cards <span class="text-xs">· measured by the server</span></h2>
      <ol id="cards" class="space-y-2"></ol>
      <p id="no-cards" class="text-term-dim">Each backend step appears here as it runs.</p>
    </section>
  </main>

  <!-- One template for every action card (README conventions). data-state
       (active | ok | error | fallback | skipped) drives all the styling. -->
  <template id="card-template">
    <li class="group rounded border border-term-line bg-term-bg px-3 py-2 data-[state=active]:border-term-accent data-[state=error]:border-term-error data-[state=fallback]:border-term-warn">
      <div class="flex items-center gap-2">
        <span aria-hidden="true" class="size-2 shrink-0 rounded-full bg-term-dim group-data-[state=active]:animate-pulse group-data-[state=active]:bg-term-accent group-data-[state=ok]:bg-term-accent group-data-[state=error]:bg-term-error group-data-[state=fallback]:bg-term-warn motion-reduce:animate-none"></span>
        <span data-role="title" class="flex-1 truncate"></span>
        <span data-role="duration" class="tabular-nums text-term-dim"></span>
      </div>
      <ul data-role="details" class="mt-1 space-y-0.5 pl-4 text-xs text-term-dim"></ul>
    </li>
  </template>
</body>
</html>
